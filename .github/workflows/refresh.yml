name: Refresh snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Pull the public sources
        run: python -m waterwatch.snapshot --live
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        with:
          name: water-snapshot
          path: data/snapshot
          if-no-files-found: error
